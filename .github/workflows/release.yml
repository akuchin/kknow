# Release on tag. Prepare it with `scripts/release.sh X.Y.Z`, then
# `git push origin main vX.Y.Z`.
#
# Builds the app (macOS Apple Silicon only, Linux, Windows) and the `kknow` CLI,
# and uploads them to the GitHub Release for the tag. The app is not signed.
# The README "Installation" section tells how to open it on macOS. At the end,
# the Homebrew cask gets the new version and checksum.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0); it must already exist in the repository"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The file names come from the version in Cargo.toml, and the cask builds its
  # URL from the tag. If they differ, Homebrew cannot find the file. Stop here,
  # before the release exists.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml
        run: |
          version="$(scripts/version.sh)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG, but Cargo.toml has version $version"
            exit 1
          fi

  create-release:
    needs: check-version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "kknow $TAG" --generate-notes
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and upload app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release -p kknow-cli --target ${{ matrix.target }}

      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="target/${{ matrix.target }}/release"
          name="kknow-cli-$TAG-${{ matrix.target }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$dir" && 7z a "$OLDPWD/$name.zip" kknow.exe)
            file="$name.zip"
          else
            tar -czf "$name.tar.gz" -C "$dir" kknow
            file="$name.tar.gz"
          fi
          gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber

  # Updates the cask in akuchin/homebrew-kknow. The workflow token cannot write
  # to another repository, so this needs the HOMEBREW_TAP_TOKEN secret: a
  # fine-grained token with "Contents: read and write" on that repository only.
  update-tap:
    needs: app
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::no HOMEBREW_TAP_TOKEN secret; update the cask by hand"
            exit 0
          fi

          version="${TAG#v}"
          dmg="kknow_${version}_aarch64.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg"
          sha="$(sha256sum "$dmg" | cut -d' ' -f1)"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/akuchin/homebrew-kknow.git" tap
          cd tap
          sed -i \
            -e "s/^  version \".*\"$/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
            Casks/kknow.rb
          grep -q "version \"$version\"" Casks/kknow.rb
          grep -q "sha256 \"$sha\"" Casks/kknow.rb

          if git diff --quiet; then
            echo "the cask already has $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "kknow $version"
          git push origin HEAD
