# Release on tag: `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# The tag is the only source of the version. `Cargo.toml` in the repository
# keeps `0.0.0`, and each build job writes the tag version into it before it
# builds. Thus a tag and the files cannot disagree, and a release needs no
# version commit.
#
# Builds the app (macOS Apple Silicon only, Linux, Windows) and the `kknow` CLI,
# and uploads them to the GitHub Release for the tag. The app is not signed.
# The README "Installation" section tells how to open it on macOS. At the end,
# the Homebrew cask gets the new version and checksum.
#
# Auto-update: the build signs the update archives with the
# TAURI_SIGNING_PRIVATE_KEY secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD),
# and `tauri-action` adds `latest.json`. The installed apps read that file from
# the latest release. Thus the release stays a draft until all platforms are
# built: a published release without `latest.json` gives the apps a 404, and
# a half-built one offers an update only to some platforms.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0); it must already exist in the repository"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The version goes into Cargo.toml, file names and the cask. Windows MSI
  # accepts only numbers, so `v1.2` or `v1.2.3-beta` stop here, before the
  # release exists.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag is vX.Y.Z
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z"
            exit 1
          fi

      # Without the key, the apps of this release could not check the
      # signature of the next one. Stop before the release exists.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Update signing is set up
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::no TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi
          pubkey="$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)"
          if [[ -z "$pubkey" || "$pubkey" == "null" ]]; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is empty"
            exit 1
          fi

  create-release:
    needs: check-tag
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      # A draft. The API "release by tag" does not see drafts, so a second run
      # (workflow_dispatch) finds the release in the list and reuses it.
      #
      # A new release takes its id from the create response, not from the
      # list: the list shows a new release only after a delay. With an empty
      # id, `tauri-action` silently skips all uploads, and the release gets
      # only the CLI. Thus an empty id stops the workflow.
      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          if [[ -z "$id" ]]; then
            # The API makes a missing tag from the default branch on publish.
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="kknow $TAG" \
              -F draft=true -F generate_release_notes=true --jq .id)"
          fi
          if [[ -z "$id" ]]; then
            echo "::error::no release id for $TAG"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cargo set-version` (cargo-edit) sets `[workspace.package]` and updates
      # Cargo.lock. Only this one command is built, and rust-cache keeps the
      # binary in ~/.cargo/bin between runs.
      - name: Set version from tag
        shell: bash
        run: |
          if ! cargo set-version --help >/dev/null 2>&1; then
            cargo install cargo-edit --locked --no-default-features --features set-version
          fi
          cargo set-version --workspace "${TAG#v}"

      # `tauri.release.conf.json` turns on the update archives. They are not in
      # the main config: a local `pnpm build:app` has no private key, and the
      # build would fail.
      - name: Build and upload app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Build CLI
        run: cargo build --release -p kknow-cli --target ${{ matrix.target }}

      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="target/${{ matrix.target }}/release"
          name="kknow-cli-$TAG-${{ matrix.target }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$dir" && 7z a "$OLDPWD/$name.zip" kknow.exe)
            file="$name.zip"
          else
            tar -czf "$name.tar.gz" -C "$dir" kknow
            file="$name.tar.gz"
          fi
          gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber

  # All platforms are on the release: now the apps can see it.
  publish:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Updates the cask in akuchin/homebrew-kknow. The workflow token cannot write
  # to another repository, so this needs the HOMEBREW_TAP_TOKEN secret: a
  # fine-grained token with "Contents: read and write" on that repository only.
  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::no HOMEBREW_TAP_TOKEN secret; update the cask by hand"
            exit 0
          fi

          version="${TAG#v}"
          dmg="kknow_${version}_aarch64.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg"
          sha="$(sha256sum "$dmg" | cut -d' ' -f1)"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/akuchin/homebrew-kknow.git" tap
          cd tap
          sed -i \
            -e "s/^  version \".*\"$/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
            Casks/kknow.rb
          grep -q "version \"$version\"" Casks/kknow.rb
          grep -q "sha256 \"$sha\"" Casks/kknow.rb

          if git diff --quiet; then
            echo "the cask already has $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "kknow $version"
          git push origin HEAD
