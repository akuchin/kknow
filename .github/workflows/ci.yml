# Checks on each push and pull request: tests, clippy and the UI build.
#
# A change only in the documentation site does not touch the app, so it does
# not start this workflow. `docs.yml` builds the site.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:test
      # The app embeds ui/dist, so the UI builds before cargo.
      - run: pnpm ui:build
      # Smoke tests of the window on the mock commands, in Chromium only: it
      # is the fastest. `pnpm ui:e2e:webkit` runs them in WebKit locally.
      - run: pnpm --filter kknow-ui exec playwright install --with-deps chromium
      - run: pnpm ui:e2e

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
