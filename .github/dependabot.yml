# Weekly update PRs for the Actions in the workflows and for the Rust crates.
# All updates of one ecosystem come as one PR, major ones too: one PR to
# check and merge instead of a PR per dependency. CI runs on it, so a major
# update that breaks the build shows there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
