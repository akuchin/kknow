# A local S3 for the sync tests: the same protocol, but on this machine.
#
#   docker compose up -d
#   cargo test -p kknow-sync --test minio -- --ignored
#
# MinIO served this before. Its community images are gone: Docker Hub answers
# 404 for `minio/minio`, and quay.io asks for a login. s3mock needs no account,
# starts in a second and holds everything in memory. It has no web console, so
# the address below is the API only.

services:
  s3:
    image: adobe/s3mock:latest
    ports:
      # The tests default to http://localhost:9000 (see tests/minio.rs).
      - "9000:9090"

  # The bucket must exist before the first test, so a separate step creates it.
  # One PUT is enough: s3mock takes any credentials, and its `initialBuckets`
  # setting has no effect in this image. `--retry` waits for the server to come
  # up — a JRE image carries no shell tool for a healthcheck.
  bucket:
    image: curlimages/curl:latest
    depends_on:
      - s3
    command:
      - "--silent"
      - "--show-error"
      - "--fail"
      - "--retry"
      - "30"
      - "--retry-delay"
      - "1"
      - "--retry-all-errors"
      - "--request"
      - "PUT"
      - "http://s3:9090/kknow"
