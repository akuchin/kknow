[package]
name = "kknow-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# TypeScript declarations of the types that the window gets
# (`ui/src/bindings.ts`). The src-tauri tests turn it on; builds do not.
ts = ["dep:ts-rs"]

[dependencies]
kknow-core.workspace = true
kknow-index.workspace = true
# The app does not need storage backends: it uses the SyncProvider trait,
# and the binary that builds the app adds the concrete S3 backend.
kknow-sync.workspace = true
# Commands attached to a note, folder or vault: the trait and the runner live
# there, and target resolution by note ID lives here.
kknow-run.workspace = true
thiserror.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
# Only for theme manifests: no other app state is serialized.
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
