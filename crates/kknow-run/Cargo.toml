[package]
name = "kknow-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# TypeScript declarations of the types that the window gets
# (`ui/src/bindings.ts`). The src-tauri tests turn it on; builds do not.
ts = ["dep:ts-rs"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

# Only for `killpg` and `poll`. On timeout we must kill everything the shell
# started, not only the shell, and a reader must ask whether the pipe has data
# before it blocks on a read. The standard library has neither.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The same two jobs on Windows, where the names differ: a job object stands in
# for the process group, and `PeekNamedPipe` for `poll`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  # `CreateJobObjectW` takes `SECURITY_ATTRIBUTES` from this module, so the
  # function compiles in only with it.
  "Win32_Security",
] }

[dev-dependencies]
tempfile.workspace = true
