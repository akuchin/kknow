[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
# Release builds take the version from the git tag (see release.yml).
# 0.0.0 marks a local build.
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/akuchin/kknow"

[workspace.dependencies]
kknow-core = { path = "crates/kknow-core" }
kknow-index = { path = "crates/kknow-index" }
kknow-app = { path = "crates/kknow-app" }
# Crates that need storage backends enable them. The core needs only the trait.
kknow-sync = { path = "crates/kknow-sync", default-features = false }
kknow-run = { path = "crates/kknow-run" }

thiserror = "2"
walkdir = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
tantivy = "0.25"
notify = "8"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# Encryption of sync (`kknow_sync::crypto`). All pure Rust.
chacha20poly1305 = "0.11"
aes-siv = "0.8"
argon2 = "0.6"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
# The CLI reads a passphrase without an echo.
rpassword = "7"
# TypeScript types for the window (`ui/src/bindings.ts`). Only tests use it:
# the crates have a `ts` feature, and only the dev-dependencies of src-tauri
# turn it on.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
opendal = { version = "0.57", features = ["services-s3", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# The MCP server of the app: a small blocking HTTP server for one local client.
tiny_http = "0.12"

# Keep target/debug small: full debug info on macOS keeps one object file per
# codegen unit, and stale copies pile up to tens of GB. Line tables are enough
# for backtraces; dependencies get no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 with 64 MiB takes seconds without optimization. A debug build of the
# window must unlock a vault as fast as a release build.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
